<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1B2A41" />
    <meta name="description" content="NOVA Gaming - Next-Gen Multi-Game Platform" />

    <!-- PWA & Mobile Standalone Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NOVA Gaming" />
    <meta name="application-name" content="NOVA Gaming" />
    <meta name="msapplication-TileColor" content="#1B2A41" />

    <!-- Icons & Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />

    <title>NOVA GAMING - Next-Gen Multi-Game Platform</title>
  </head>
  <body class="bg-[#0b0f19] text-white min-h-screen antialiased select-none">
    <div id="root">
      <!-- Instant App Loading Splash Screen -->
      <style>
        @keyframes novaPulse {
          0%, 100% { transform: scale(1); opacity: 0.8; }
          50% { transform: scale(1.08); opacity: 1; }
        }
        @keyframes novaSpin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
        @keyframes novaSpinReverse {
          0% { transform: rotate(360deg); }
          100% { transform: rotate(0deg); }
        }
        @keyframes novaBar {
          0% { transform: translateX(-100%); }
          50% { transform: translateX(100%); }
          100% { transform: translateX(200%); }
        }
      </style>
      <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; width: 100vw; background: radial-gradient(circle at center, #161b2e 0%, #0b0f19 70%, #070a12 100%); font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; text-align: center; padding: 20px; box-sizing: border-box;">
        <!-- Glowing Core & Orbital Rings -->
        <div style="position: relative; width: 110px; height: 110px; display: flex; align-items: center; justify-content: center; margin-bottom: 24px;">
          <!-- Ambient Glow -->
          <div style="position: absolute; width: 120px; height: 120px; border-radius: 50%; background: radial-gradient(circle, rgba(6, 182, 212, 0.3) 0%, rgba(139, 92, 246, 0.25) 50%, transparent 70%); filter: blur(20px); animation: novaPulse 2.8s ease-in-out infinite;"></div>
          <!-- Outer Neon Ring -->
          <div style="position: absolute; width: 100px; height: 100px; border-radius: 50%; border: 2.5px solid transparent; border-top-color: #22d3ee; border-right-color: #a855f7; animation: novaSpin 2.4s linear infinite;"></div>
          <!-- Inner Counter-Spinning Ring -->
          <div style="position: absolute; width: 78px; height: 78px; border-radius: 50%; border: 1.5px dashed rgba(168, 85, 247, 0.5); animation: novaSpinReverse 3.8s linear infinite;"></div>
          <!-- Emblem Core -->
          <div style="position: relative; width: 54px; height: 54px; border-radius: 16px; background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); border: 1px solid rgba(34, 211, 238, 0.5); box-shadow: 0 0 20px rgba(34, 211, 238, 0.3); display: flex; align-items: center; justify-content: center;">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
            </svg>
          </div>
        </div>

        <!-- Brand Name -->
        <div style="font-size: 26px; font-weight: 900; letter-spacing: 0.3em; background: linear-gradient(135deg, #38bdf8 0%, #c084fc 50%, #f59e0b 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 6px; padding-left: 0.3em;">
          NOVA
        </div>
        <div style="font-size: 10px; font-weight: 800; letter-spacing: 0.28em; color: #94a3b8; text-transform: uppercase; margin-bottom: 22px; padding-left: 0.28em;">
          NEXT-GEN GAMING PLATFORM
        </div>

        <!-- Animated Progress Bar -->
        <div style="width: 180px; height: 4px; border-radius: 9999px; background: rgba(30, 41, 59, 0.8); overflow: hidden; position: relative; border: 1px solid rgba(51, 65, 85, 0.5);">
          <div style="position: absolute; top: 0; bottom: 0; width: 80px; border-radius: 9999px; background: linear-gradient(90deg, transparent, #22d3ee, #a855f7, transparent); animation: novaBar 1.6s ease-in-out infinite;"></div>
        </div>

        <!-- Status Hint -->
        <div style="font-size: 11px; font-weight: 600; color: #64748b; margin-top: 16px; letter-spacing: 0.08em; text-transform: uppercase;">
          Loading Provably Fair Universe...
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
