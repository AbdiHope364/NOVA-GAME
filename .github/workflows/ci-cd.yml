name: CI/CD Pipeline & Production Readiness

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip unit tests for urgent hotfix'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================================================
  # 1. Quality, Security & Static Analysis (Lint, Audit, Semgrep, Gitleaks, Test)
  # ============================================================================
  security-and-test:
    name: Lint, Audit, Semgrep, Gitleaks & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Run Semgrep Static Analysis
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" returntocorp/semgrep semgrep \
            --config=auto \
            --error \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='.pnpm-store' \
            /src || true

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.0.0
          run_install: false

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency Audit (High/Critical)
        run: pnpm audit --audit-level=high || true

      - name: Lint Workspace
        run: pnpm run lint || true

      - name: Execute Test Suites (Ludo, Dama, Financial Ledger)
        if: ${{ !inputs.skip_tests }}
        run: |
          ./apps/api/node_modules/.bin/tsx --test games/ludo/src/__tests__/ludo.test.ts
          ./apps/api/node_modules/.bin/tsx games/dama/src/__tests__/rules.test.ts
          ./apps/api/node_modules/.bin/tsx games/dama/src/__tests__/ai.test.ts
          ./apps/api/node_modules/.bin/tsx apps/api/src/__tests__/ledger.test.ts

  # ============================================================================
  # 2. Build Monorepo & Container Images + Trivy Vulnerability Scan
  # ============================================================================
  build-and-scan:
    name: Build Monorepo, Containers & Trivy Scan
    needs: [security-and-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 & pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.0.0
          run_install: false

      - name: Install Dependencies & Build Monorepo (PWA + API)
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Backend API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/Dockerfile.api
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api:${{ github.sha }}

      - name: Run Trivy Vulnerability Scanner on API Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api:${{ github.sha }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push Images (main branch only)
        if: github.ref == 'refs/heads/main'
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api:${{ github.sha }}

  # ============================================================================
  # 3. Deploy to Staging Environment
  # ============================================================================
  deploy-staging:
    name: Deploy to Staging
    needs: [build-and-scan]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.novagame.et

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Staging Host via SSH / Docker Compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_VPS_HOST }}
          username: ${{ secrets.STAGING_VPS_USER }}
          key: ${{ secrets.STAGING_VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/nova-staging
            docker compose -f docker-compose.staging.yml pull || true
            docker compose -f docker-compose.staging.yml up -d --build
            sleep 6
            curl -sf http://localhost:5000/health || exit 1
            echo "✅ Staging deployed and healthy!"

  # ============================================================================
  # 4. Deploy to Production (Manual Approval Gate via GitHub Environment)
  # ============================================================================
  deploy-production:
    name: Deploy to Production (Approval Required)
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://novagame.et

    steps:
      - name: Deploy to Production VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_VPS_HOST }}
          username: ${{ secrets.PROD_VPS_USER }}
          key: ${{ secrets.PROD_VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/nova-gaming

            echo "🚀 Deploying Production Release: ${{ github.sha }}..."

            # Pull latest images
            docker compose -f docker-compose.prod.yml pull

            # Run Prisma production migrations
            echo "🔄 Applying Prisma migrations..."
            docker compose -f docker-compose.prod.yml run --rm \
              api npx prisma migrate deploy --schema=packages/database/prisma/schema.postgresql.prisma

            # Rolling zero-downtime service restart
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Verify health probe
            sleep 8
            curl -sf http://localhost:5000/ready || curl -sf http://localhost:5000/readyz || exit 1
            echo "✅ Production successfully deployed, verified, and operational!"
