version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: nova-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: nova
      POSTGRES_PASSWORD: nova123
      POSTGRES_DB: nova_gaming
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: nova-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
